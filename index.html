<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="margin:0; overflow:hidden; background:#000;">
    <video id="webcam" autoplay playsinline style="position:absolute; width:100%; transform:scaleX(-1);"></video>
    <canvas id="output_canvas" style="position:absolute; width:100%;"></canvas>

    <script>
        // Use the global window object instead of module imports
        const { HandLandmarker, FilesetResolver } = window.vision;

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
                runningMode: "VIDEO", numHands: 1
            });

            const video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            // Simple loop to check for hands
            video.onloadeddata = () => {
                function predict() {
                    const results = handLandmarker.detectForVideo(video, Date.now());
                    if (results.landmarks.length > 0) {
                        console.log("Hand detected!"); // Check console for this!
                    }
                    requestAnimationFrame(predict);
                }
                predict();
            };
        }
        init();
    </script>
</body>
</html>
