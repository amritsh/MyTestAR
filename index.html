<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
       <img id="grid" src="https://i.imgur.com/mYmmjZt.jpg">
    </a-assets>

    <a-marker preset="hiro">
      
      <a-entity position="0 0.5 0" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        
        <a-cylinder position="0 -0.2 0" radius="0.3" height="0.1" color="#FF4444"></a-cylinder>
        
        <a-box position="0 0 0" width="0.5" height="0.5" depth="0.5" 
               material="src: #grid; color: yellow; opacity: 0.9; transparent: true"></a-box>
        
        <a-sphere position="0 0.4 0" radius="0.2" color="#4444FF"></a-sphere>
        
        <a-torus-knot position="0 0 0" radius="0.6" radius-tubular="0.02" 
                        animation="property: rotation; to: 360 0 0; loop: true; dur: 3000; easing: linear"
                        color="#44FF44" material="wireframe: true"></a-torus-knot>

      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
