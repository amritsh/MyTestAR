<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gesture Totem</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js";

        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('output_canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 2. Create your Totem (The shapes you just used)
        const totem = new THREE.Group();
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshNormalMaterial());
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0x0000ff}));
        sphere.position.y = 0.1;
        totem.add(box, sphere);
        totem.visible = false; // Hidden until hand detected
        scene.add(totem);
        camera.position.z = 1;

        // 3. MediaPipe Init
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        const handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
            runningMode: "VIDEO", numHands: 1
        });

        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

        // 4. Gesture Detection Loop
                function render() {
            if (video.readyState === 4) {
                const results = handLandmarker.detectForVideo(video, Date.now());
                
                // Clear the canvas
                const ctx = document.getElementById('output_canvas').getContext('2d');
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                if (results.landmarks.length > 0) {
                    const palm = results.landmarks[0][0];
                    const tip = results.landmarks[0][8];
                    
                    // 1. Draw a red circle on your palm so you know the AI sees you
                    ctx.fillStyle = 'red';
                    ctx.beginPath();
                    ctx.arc(palm.x * window.innerWidth, palm.y * window.innerHeight, 20, 0, 2 * Math.PI);
                    ctx.fill();

                    // 2. Logic
                    const dist = Math.hypot(tip.x - palm.x, tip.y - palm.y);
                    totem.visible = true;
                    // Flip X coordinate because camera is mirrored
                    totem.position.set((palm.x - 0.5) * -2, (palm.y - 0.5) * -2, 0);

                    if (dist < 0.1) totem.position.y += 0.05; 
                } else {
                    totem.visible = false;
                }
            }
            renderer.render(scene, camera);
            requestAnimationFrame(render);
                }
        
        video.onloadeddata = render;
    </script>
</body>
</html>
